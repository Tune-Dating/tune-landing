<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>About Tune</title>
  <meta name="description" content="Tune is a new dating app, launching in the US." />

  <!-- Social preview -->
  <meta property="og:title" content="About Tune" />
  <meta property="og:description" content="A new dating app, launching in the US." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tune.dating/about/" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-1: #181030;
      --bg-2: #2a1539;
      --ink: #f5ece3;
      --muted: #b3a6c2;
      --coral: #ff8a5b;
      --rose: #ef82ab;
      --focus: #ffd9a3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100svh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      justify-items: center;
      padding: 1.6rem 1.5rem 1.4rem;
      background:
        radial-gradient(120% 90% at 50% 18%, rgba(255, 138, 91, 0.16), transparent 55%),
        linear-gradient(165deg, var(--bg-1) 0%, var(--bg-2) 100%);
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      text-align: center;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .home {
      justify-self: start;
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: 1.75rem;
      line-height: 1;
      letter-spacing: -0.02em;
      text-decoration: none;
      background: linear-gradient(100deg, var(--coral), var(--rose));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .home:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

    .page { align-self: center; max-width: 34rem; padding: 4rem 0; }

    h1 {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.5rem, 8vw, 4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .lede {
      font-family: "Fraunces", Georgia, serif;
      font-weight: 500;
      font-size: clamp(1.25rem, 3.2vw, 1.6rem);
      line-height: 1.3;
      margin-top: 1.5rem;
    }

    .body {
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.6;
      margin-top: 1rem;
    }

    .foot {
      display: grid;
      gap: 0.8rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .foot nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem 1.75rem; }
    .foot a { color: var(--ink); text-decoration: none; border-bottom: 1px solid rgba(245, 236, 227, 0.25); }
    .foot a:hover { border-color: var(--coral); }
    .foot a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .foot a[aria-current="page"] { color: var(--muted); border-color: transparent; }
    .legal { font-size: 0.78rem; line-height: 1.6; }
  </style>
</head>
<body>
  <a class="home" href="/">Tune</a>

  <main class="page">
    <h1>About Tune</h1>
    <p class="lede">A new dating app, launching in the&nbsp;US.</p>
    <p class="body">Dating is overdue for a fresh perspective. We'll share ours closer to&nbsp;launch.</p>
  </main>

  <footer class="foot">
    <nav aria-label="Footer">
      <a href="/about/" aria-current="page">About Tune</a>
      <a href="mailto:career@tune.dating">Careers</a>
      <a href="mailto:support@tune.dating">Contact</a>
    </nav>
    <p class="legal">© 2026 Tunelab Technologies, Inc.<br />251 Little Falls Drive, Wilmington, DE 19808</p>
  </footer>
</body>
</html>
